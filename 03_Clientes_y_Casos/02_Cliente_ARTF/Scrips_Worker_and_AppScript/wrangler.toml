# Cloudflare Worker — Bot conversacional ARTF (SOP V4.2)
#
# Worker NUEVO y separado. No toca el Worker viejo del bot ni el de captura
# pasiva: cada uno tiene su propio nombre, su propia URL y sus propios secrets.
#
# Desplegar:
#   npm i -g wrangler        (o npx wrangler)
#   wrangler login
#   wrangler deploy
#
# Los secrets NO van en este archivo (ver guia de despliegue):
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put MANYCHAT_API_TOKEN
#   wrangler secret put MANYCHAT_IDS_PRUEBA

name = "artf-bot-setter-v42"
main = "worker_bot_setter_v42.js"
compatibility_date = "2026-09-01"

# nodejs_compat no hace falta: el Worker solo usa APIs estandar (fetch, crypto,
# caches). Se deja fuera a proposito para mantener el bundle chico y el
# arranque en frio bajo.

# ---------------------------------------------------------------------------
# MODO DEL BOT
# ---------------------------------------------------------------------------
# "false" = SECRETARIA INVISIBLE: lee, clasifica y guarda en Supabase para
#           alimentar el dashboard, pero NO le responde al lead ni avanza el
#           embudo. Es el canario para salir a trafico real con riesgo cero.
# "true"  = el bot conversa normalmente.
#
# Va como VAR y no como secret a proposito: no es informacion sensible y asi
# queda versionado -- se ve en el diff quien encendio el bot y cuando.
[vars]
BOT_ACTIVO = "true"

# ---------------------------------------------------------------------------
# FASE 2B — AGRUPAMIENTO DE BURBUJAS (14-sep-2026)
# ---------------------------------------------------------------------------
# El experimento de la Fase 0 (retirado abajo) demostro que ManyChat ENCOLA los
# webhooks por contacto: con una espera de 5 s en el Worker, la burbuja
# siguiente no entro hasta 7 s despues, justo al soltar la primera. Por eso el
# debounce sincrono era inutil y se aprobo la asincronia real.
#
# "true"  = la burbuja se guarda en el Durable Object del lead, se le contesta
#           `responder:false` a ManyChat en ~50 ms y el turno se procesa cuando
#           vence la alarma, respondiendo por /fb/sending/sendContent.
# "false" = el Worker se comporta EXACTAMENTE como antes (camino intacto).
#
# Es una perilla de apagado en caliente, no un canario: permite separar el
# despliegue del binding del cambio de comportamiento, y volver atras sin
# redesplegar si algo sale mal.
LOTE_AGRUPAMIENTO = "true"

# Ventana de agrupamiento en ms. Se REPROGRAMA con cada burbuja nueva, asi que se
# cuenta desde la ULTIMA que escribio el lead.
#
# 25 s desde el 14-sep-2026 (decision del fundador, subida desde 7 s): la gente
# escribe por pedazos y 7 s partia mensajes que eran uno solo.
LOTE_VENTANA_MS = "35000"

# Tope duro desde la PRIMERA burbuja del lote. Sin el, un lead que escribe una
# palabra cada 5 s renovaria la ventana para siempre y el bot no contestaria
# nunca. Pasado el tope se procesa lo que haya.
#
# ⚠️ TIENE QUE SER VARIAS VECES LA VENTANA, O LA ANULA. Con tope 25 s y ventana
# 25 s, cualquier lead que escriba una segunda burbuja pasados 25 s del inicio
# dispara el tope antes de que la ventana llegue a cumplirse: el agrupamiento se
# cortaria siempre por el tope y la ventana no serviria de nada. Al subir la
# ventana a 25 s, el tope sube a 90 s para que siga siendo el freno de
# emergencia que es, y no el mecanismo normal.
LOTE_TOPE_MS = "90000"

# ---------------------------------------------------------------------------
# FASE 0 — EXPERIMENTO RETIRADO (14-sep-2026). Cumplio su proposito: la espera
# de 5 s midio que ManyChat encola por contacto, lo que aprobo la Fase 2B. Se
# retira porque dormir el Worker con leads reales ya no aporta nada y solo
# retrasa la cola.
# ---------------------------------------------------------------------------

[observability]
enabled = true

# ---------------------------------------------------------------------------
# FASE 2B — DURABLE OBJECT DEL LOTE
# ---------------------------------------------------------------------------
# Uno por `subscriber_id`: Cloudflare garantiza una sola instancia por nombre y
# ejecucion de un solo hilo, asi que los turnos de un mismo lead quedan
# serializados por construccion.
[[durable_objects.bindings]]
name = "LOTE"
class_name = "LoteDeLead"

# ⚠️ `new_sqlite_classes` Y NO `new_classes`. En el plan gratuito de Cloudflare
# solo existen los Durable Objects con backend SQLite; los de key-value exigen
# plan de pago. Con `new_classes` el deploy falla en una cuenta Free y el error
# no explica por que. Esta linea no se cambia sin leer eso primero.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoteDeLead"]
